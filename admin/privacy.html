<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>網站使用統計說明</title><main style="font:16px/1.8 system-ui;max-width:700px;margin:3em auto;padding:1em"><h1>網站使用統計說明</h1><p>好玩實驗室 P 系列網站使用匿名統計，記錄首頁瀏覽次數、匿名短期識別碼、工作階段、裝置類型、來源網站網域及估計停留時間，用於改善網站服務與教學研究室的管理。</p><p>應用程式不儲存原始 IP、姓名、電子郵件或登入憑證。匿名識別碼有效期約七天；原始事件預定保留 90 天，彙總統計可保留較長時間。網路服務供應商可能另有基礎設施紀錄。</p><p>瀏覽器停用 JavaScript 或封鎖追蹤可能使統計無法運作。若需詢問資料處理方式，請透過慈濟大學經營管理學系聯絡。</p><p><a href="../">返回好玩實驗室</a></p></main></html>
