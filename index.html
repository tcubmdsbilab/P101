<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI Lab</title>
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", sans-serif;
      background: #f5f7f6;
      color: #333;
    }
    header {
      background: linear-gradient(135deg, #cfe8e8, #f2e4c8);
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 32px;
    }
    h2 {
      margin: 5px 0;
      font-weight: normal;
      color: #555;
    }
    .tagline {
      margin-top: 10px;
      font-style: italic;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }
    .section-title {
      border-left: 5px solid #8fbcbc;
      padding-left: 10px;
      margin: 40px 0 20px;
      font-size: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }
    .card-content {
      padding: 15px;
    }
    .card-title {
      font-size: 18px;
      margin-bottom: 5px;
    }
    .card-desc {
      font-size: 14px;
      color: #666;
    }
    .versions {
      margin-top: 10px;
      font-size: 13px;
    }
    .versions a {
      margin-right: 8px;
      text-decoration: none;
      color: #5a8f8f;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

<header>
  <h1>智慧商情研究室</h1>
  <h2>Smart Business Intelligence Lab (SBI Lab)</h2>
  <div class="tagline">Learn. Analyze. Innovate.</div>
  <p>慈濟大學 經營管理學系</p>
  <p>來打造一個可參訪的好玩實驗室吧</p>
</header>

<div class="container">

  <div class="section-title">研究室目標</div>
  <ul>
    <li>管理智慧商情研究室</li>
    <li>管理智慧商店設備</li>
    <li>設計開發商情專案，管理商情伺服器</li>
    <li>協助經營管理學系專題製作或相關課程</li>
    <li>參與智慧商情相關計畫或研究</li>
  </ul>

  <div class="section-title">學生作品</div>

  <div class="card">
    <img src="https://picsum.photos/800/300?random=1">
    <div class="card-content">
      <div class="card-title">P101 校園空間查詢系統</div>
      <div class="card-desc">提供校園空間快速查詢，協助新生與訪客找到正確位置。</div>
      <div class="versions">
        最新版本：<a href="https://liu-ming-yi.github.io/CampusMap01/">V01</a><br>
        歷史版本：
        <a href="https://liu-ming-yi.github.io/CampusMap01/">V01</a>

      </div>
    </div>
  </div>

</div>

<footer>
  © SBI Lab - Tzu Chi University
</footer>

</body>
</html>
